name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plebiapplet-storefront
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plebiapplet-storefront/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check and build the single-file artifact
        run: pnpm verify

      - name: Install the Chromium conformance runs against
        run: pnpm exec playwright install --with-deps chromium

      # Non-zero exit fails the job: boot errors, malformed envelopes, forbidden
      # browser-authority references, or a crash with no NAP domains injected.
      - name: NAP protocol conformance
        run: pnpm test:conformance
